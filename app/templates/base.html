<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Stitchbook{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <p class="site-title"><a href="{{ url_for('dashboard.index') }}">Stitchbook</a></p>
    <nav class="site-nav">
      <a href="{{ url_for('dashboard.index') }}" {% if request.endpoint == 'dashboard.index' %}aria-current="page"{% endif %}>Dashboard</a>
      <a href="{{ url_for('projects.list_projects') }}" {% if request.blueprint == 'projects' %}aria-current="page"{% endif %}>Projects</a>
      <a href="{{ url_for('patterns.list_patterns') }}" {% if request.blueprint == 'patterns' %}aria-current="page"{% endif %}>Patterns</a>
      <a href="{{ url_for('fabrics.list_fabrics') }}" {% if request.blueprint == 'fabrics' %}aria-current="page"{% endif %}>Fabrics</a>
      <a class="button nav-action" href="{{ url_for('projects.create_project') }}">+ New Project</a>
    </nav>
  </header>
  <main class="site-main">
    {% for message in get_flashed_messages() %}
      <p class="flash">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
